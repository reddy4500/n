<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NEET PG AI Agent</title>
  <meta name="description" content="AI-powered NEET PG preparation agent: dynamic MCQs, mock tests, voice mentor, daily coaching, flashcards and study planner." />
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32" />
        <div><strong>NEET PG</strong><span>AI Agent</span></div>
      </div>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="pageTitle">Home</div>
        <div class="topbar-right">
          <span class="pill" id="streakPill" title="Study streak"></span>
          <span class="pill" id="countdownPill" title="Days to exam"></span>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <nav id="bottomNav" class="bottom-nav" aria-label="Quick"></nav>

  <button id="micFab" class="mic-fab" aria-label="Voice command" title="Voice command (press M)">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
  </button>
  <div id="voiceBar" class="voice-bar" hidden>
    <span class="dot"></span><span id="voiceText">Listening…</span>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
